<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />

  <!-- Ambient Light Circle -->
  <circle cx="512" cy="460" r="280" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Main Iconic Emblem (House + Two Interlocking Roommates) -->
  <g filter="url(#drop)">
    <!-- House Roof Line -->
    <path d="M512 210 L280 395 C268 405 264 422 272 436 C280 450 297 455 311 444 L512 284 L713 444 C727 455 744 450 752 436 C760 422 756 405 744 395 Z" fill="#FFFFFF" />

    <!-- Left Roommate Figure -->
    <circle cx="430" cy="430" r="54" fill="#FFFFFF" />
    <path d="M350 590 C350 515 390 490 445 490 C465 490 488 496 505 508 C480 535 465 570 465 615 L465 625 L350 625 Z" fill="#FFFFFF" />

    <!-- Right Roommate Figure (Overlapping with Emerald Spark) -->
    <circle cx="594" cy="430" r="54" fill="url(#emeraldGrad)" />
    <path d="M674 590 C674 515 634 490 579 490 C548 490 520 502 500 524 C522 548 535 580 535 625 L674 625 Z" fill="url(#emeraldGrad)" />

    <!-- House Foundation Outline / Door Arch -->
    <path d="M320 460 L320 690 C320 720 344 744 374 744 L650 744 C680 744 704 720 704 690 L704 460" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="512" y="855" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Poppins', 'Inter', system-ui, sans-serif" font-weight="900" font-size="74" fill="#FFFFFF" letter-spacing="2">
    FLATEMATE
  </text>
  <!-- Dot in Logo -->
  <circle cx="756" cy="840" r="12" fill="url(#emeraldGrad)" />
</svg>
